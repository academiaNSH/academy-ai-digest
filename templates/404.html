{% extends "base.html" %}

{% block title %}Страница не найдена — Академия начальной школы{% endblock %}

{% block content %}
<section class="not-found">
  <div class="shell not-found__inner">
    <span class="not-found__code">404</span>
    <h1>Такого материала пока нет</h1>
    <p>Возможно, ссылка устарела или в адресе опечатка. На главной есть десять материалов — точно найдётся нужный.</p>
    <a class="btn btn--primary" href="{{ url_for('index') }}#cards">
      К материалам
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 12h14M13 6l6 6-6 6"/>
      </svg>
    </a>
  </div>
</section>
{% endblock %}
